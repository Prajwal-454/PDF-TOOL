# Render blueprint: free FastAPI backend for the PDF platform.
# Dashboard: New → Blueprint → select this repo. Render reads this file automatically.
services:
  - type: web
    name: pdf-tool-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MAX_UPLOAD_MB
        value: 50
      - key: FILE_TTL_HOURS
        value: 24
      - key: JOB_TTL_HOURS
        value: 24
      # After the Vercel deploy, lock this down to your frontend URL(s):
      # CORS_ORIGINS=https://<your-app>.vercel.app,http://localhost:3000
      # Default "*" allows any frontend (incl. Vercel preview URLs). Safe here:
      # the API uses no cookies/auth. Lock it down once your domain is stable.
      - key: CORS_ORIGINS
        value: "*"
      # Groq AI (free tier) for real summarize/ask. sync:false prompts for the
      # secret on Blueprint install — value never committed to git.
      # Get a free key: https://console.groq.com -> API Keys -> Create (gsk_...)
      # Empty/missing = offline extractive fallback (app still works).
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MAX_CHARS
        value: 15000
